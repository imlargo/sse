name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # RF-H1: using this library with the standard library must not drag in
      # Gin, Fiber, Redis, NATS, Prometheus or OpenTelemetry. Verified, not promised.
      - name: Core has no external dependencies (RF-H1)
        run: make deps

      # RP-5: the whole suite under the race detector.
      # RP-4: leak detection runs inside it, via each package's TestMain.
      - name: Test (race)
        run: go test -race -count=1 -short ./...

  # RP-7. Separate because it holds thousands of connections open and takes
  # long enough that it should not sit in front of every other check.
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Sustained load
        run: |
          ulimit -n 65535
          go test -run TestSoak -timeout 15m -sse.soak.conns=15000 -sse.soak.duration=60s .

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # RP-2: arbitrary input must never panic or allocate without bound.
      - name: Fuzz the parser
        run: go test -run '^$' -fuzz FuzzDecoder -fuzztime 60s ./wire

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # RNF-3: the allocation budget is asserted by a test, so a regression
      # fails CI instead of being noticed later.
      # Bounded on purpose. Go sizes the iteration count from an early, fast
      # probe, so a benchmark that degrades as it runs — anything accidentally
      # quadratic — gets extrapolated into millions of iterations and the job
      # hangs until the platform kills it. A timeout turns that into a failure
      # that names itself.
      - name: Benchmarks
        run: go test -run '^$' -bench . -benchmem -timeout 10m ./...

  # Integration tests for the distribution seam. They need a real Redis: an
  # adapter that has only been tested against a fake is not tested.
  redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Redis Streams log
        working-directory: logs/redislog
        env:
          SSE_REDIS_ADDR: 127.0.0.1:6379
        run: go test -race -count=1 ./...

  # Third-party frameworks, in their own module so their dependencies never
  # enter the core's graph.
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Gin and Echo compatibility
        working-directory: compat
        run: go test -race -count=1 ./...

  # Fiber is not built on net/http and its request context never reports a
  # client disconnection, so it gets its own job rather than being assumed to
  # work.
  fiber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Fiber adapter
        working-directory: adapters/fibersse
        run: go test -race -count=1 ./...

  # The submodules replace the core with a local path while developing. This
  # does not fail the build — it reports, so the state is visible — but the
  # release procedure requires it to be clean.
  publishable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Are the submodules publishable?
        run: make release-check || echo "::notice::submodules still point at local paths; see CONTRIBUTING.md#releasing"

  staticcheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every module. The submodules are where third-party dependencies live
        # and are exactly where a finding is easiest to miss.
        module: ['.', 'logs/redislog', 'compat', 'adapters/fibersse', 'examples/04-distributed']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false
          working-directory: ${{ matrix.module }}
